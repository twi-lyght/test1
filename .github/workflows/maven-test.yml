name: Maven Test

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  
jobs:
  test:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Surefire HTML Report
        run: |
#          pwd
#          ls -al
          mvn surefire-report:report
#          ls -al target/reports/
          

      - name: Disable Jekyll
        run: touch target/reports/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          name: surefire-report
#          path: ./target/reports
          publish_dir: ./target/reports
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add summary to workflow
        run: |
          echo "## ✅ Reports Summary" >> $GITHUB_STEP_SUMMARY
          echo "- 🧪 [Surefire Test Report](https://twi-lyght.github.io/test1/test/surefire.html)" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 [JaCoCo Coverage](https://twi-lyght.github.io/test1/jacoco/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 [SonarQube Dashboard](https://sonarcloud.io/dashboard?id=your-project-key)" >> $GITHUB_STEP_SUMMARY